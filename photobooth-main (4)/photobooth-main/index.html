<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photobooth Curtain</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="booth">

    <!-- CLOSED CURTAIN -->
    <img src="images/curtain-closed.png" class="closed">

    <!-- OPEN CURTAIN -->
    <img src="images/curtain-open.png" class="open">

    <button id="startBtn">
    START
    </button>

  </div>
  <div class="popup" id="popup">

  <div class="popup-content">

  <img src="images/3photos.png" class="option" id="threeOption">

  <img src="images/4photos.png" class="option" id="fourOption">

  </div>

</div>

  <script src="scripts/script.js"></script>
